# One publish job: export -> build -> audit gate -> Cloudflare Pages deploy -> smoke -> callback (02-BACKEND section 7, 21-PROTOCOLS 1 to 3).
# Started by the platform's `publish` Edge Function (workflow_dispatch of this file, inputs job_id and site_id, with the one-repository Actions
# token; repository_dispatch type publish while only the old token is set) and by hand (`gh workflow run publish.yml -f job_id=... -f site_id=...
# [-f force_fail=heading]`). GitHub runs a dispatch-triggered workflow only from the DEFAULT branch. Four secrets, by name: PLATFORM_FUNCTIONS_BASE, RUNNER_KEY,
# CLOUDFLARE_PAGES_TOKEN, CLOUDFLARE_ACCOUNT_ID (tools/github-secrets.mjs sets them). Nothing here echoes a secret; the runner scrubs its own output.
name: publish

on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
    inputs:
      job_id:
        description: The publish job id (publish_jobs.id) the export belongs to
        required: true
        type: string
      site_id:
        description: The site id of that job (sites.id)
        required: true
        type: string
      force_fail:
        description: heading = write a skipped heading level so the audit gate must stop the deploy
        required: false
        default: none
        type: choice
        options:
          - none
          - heading

permissions:
  contents: read

# one build per site, up to 100 waiting, none replaced (21-PROTOCOLS section 1). If GitHub rejects `queue` on the first run, the exact
# error goes to the head as a finding and this falls back to `cancel-in-progress: false` (one pending run per group).
concurrency:
  group: site-${{ github.event.client_payload.site_id || inputs.site_id }}
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Run the publish runner
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
          SITE_ID: ${{ github.event.client_payload.site_id || inputs.site_id }}
          FORCE_FAIL: ${{ inputs.force_fail }}
          PLATFORM_FUNCTIONS_BASE: ${{ secrets.PLATFORM_FUNCTIONS_BASE }}
          RUNNER_KEY: ${{ secrets.RUNNER_KEY }}
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          args=()
          if [ "$FORCE_FAIL" = "heading" ]; then
            args+=(--force-fail heading)
          fi
          node factory/runner/publish.mjs "${args[@]}"
