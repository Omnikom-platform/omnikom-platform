# Nightly dump of the STAGING database to Cloudflare R2 (10-DELIVERY section 5, 18-BUDGET-ARCHITECTURE 2.4).
# BLOCKED: R2 is deferred by the owner (25-BUILD-SEQUENCE step 1.3), so there is no bucket and no R2 key to write to.
# Unblocked by: (1) the owner enabling R2 and creating a private bucket, (2) the repository secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# and R2_BUCKET (CLOUDFLARE_ACCOUNT_ID already exists), (3) the repository variable BACKUP_ENABLED = true. Until then the job is skipped.
# Retention (30 days) is a lifecycle rule on the bucket, not a step here. The production dump belongs to the production repository's
# own workflow (DECISIONS 29 D21); this one never holds a production key. No step prints a row: pg_dump writes to a file only.
name: backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install the PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump staging to a file (custom format, no owners)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          pg_dump "$STAGING_DB_URL" --format=custom --no-owner --no-privileges --file "$RUNNER_TEMP/staging.dump"
          echo "dump bytes: $(stat -c %s "$RUNNER_TEMP/staging.dump")"

      - name: Copy the dump to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
          aws s3 cp "$RUNNER_TEMP/staging.dump" "s3://${R2_BUCKET}/staging/staging-${stamp}.dump" \
            --endpoint-url "https://${R2_ENDPOINT_ACCOUNT}.r2.cloudflarestorage.com" --only-show-errors
          echo "uploaded staging-${stamp}.dump"
