# Nightly encrypted dump of the STAGING database to two S3-compatible buckets: Cloudflare R2 and a second provider
# (10-DELIVERY section 5, 11-OPERATIONS section 3, 18-BUDGET-ARCHITECTURE 2.4). The work is supabase/ops/backup.mjs (its header says how).
# BLOCKED until the owner does these (each is an account or secret click, none is done by a session):
#   (1) makes the key pair OFFLINE and commits only the public certificate as supabase/ops/backup-recipient.pem (supabase/ops/README.md);
#   (2) enables R2 and creates a private bucket, and a bucket at a second provider (Backblaze B2, Wasabi...), each with a write-only key;
#   (3) adds the repository secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET (CLOUDFLARE_ACCOUNT_ID exists) and
#       BACKUP2_ENDPOINT, BACKUP2_BUCKET, BACKUP2_ACCESS_KEY_ID, BACKUP2_SECRET_ACCESS_KEY;
#   (4) sets the repository variable BACKUP_ENABLED = true. Until then the job is skipped.
# Nothing here can decrypt a backup: the dump is encrypted to the public certificate and the private key stays with the owner.
# Retention (30 days) is a lifecycle rule on each bucket, not a step here. The production dump is the production repository's own workflow
# (.github/production/backup.yml, DECISIONS 29 D21); this one never holds a production key. No step prints a row, a URL or a key.
name: backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      # Supabase runs PostgreSQL 17 (the staging dump said "Dumped from database version: 17.11"); pg_dump refuses a server newer than itself,
      # so the client is 17, not 16. The runner image already knows the PostgreSQL apt repository; the second branch adds it if it does not.
      - name: Install the PostgreSQL 17 client
        run: |
          sudo apt-get update
          if ! apt-cache show postgresql-client-17 > /dev/null 2>&1; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          fi
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Back up staging (dump, encrypt to the public certificate, upload to both buckets, verify each by size)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP2_ENDPOINT: ${{ secrets.BACKUP2_ENDPOINT }}
          BACKUP2_BUCKET: ${{ secrets.BACKUP2_BUCKET }}
          BACKUP2_ACCESS_KEY_ID: ${{ secrets.BACKUP2_ACCESS_KEY_ID }}
          BACKUP2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP2_SECRET_ACCESS_KEY }}
        run: |
          pg_dump --version
          node supabase/ops/backup.mjs --db STAGING_DB_URL --privileges \
            --to "s3://${R2_BUCKET}/staging" --env R2 \
            --to "s3://${BACKUP2_BUCKET}/staging" --env BACKUP2
