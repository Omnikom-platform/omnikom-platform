# CI (02-BACKEND section 11, 10-DELIVERY section 3, 23-GROUND-RULES section 3): the same gates the head runs by hand, on every push and
# pull request. Every job is independent, has a timeout, holds no secret, and starts from a clean checkout. Every third-party action
# is pinned by commit SHA (supply-chain rule 7); the four downloaded binaries (gitleaks, osv-scanner, actionlint, shellcheck) are pinned by version AND sha256.
# Expected red on the first run: see factory/README.md "Runner" (the `functions` and `gates` jobs depend on work that may not be merged).
name: ci

on:
  push:
    # the land lock (tools/omnikom-cli/lib/landlock.mjs) is a queue marker, not code: its push starts no run
    branches-ignore: [land-lock]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (contracts, database walls, specs, signature, deno check)
    runs-on: ubuntu-latest
    # the walls gate has its own 60-minute limit inside run-all-gates.mjs (214 mutants, 17 min on a quiet laptop)
    timeout-minutes: 75
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: ICM index is fresh
        run: node tools/icm/index.mjs --check
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.1
      - name: PostgreSQL 16 binaries on PATH (the image's own; apt install postgresql only if the image lacks them)
        run: |
          if [ -x /usr/lib/postgresql/16/bin/initdb ]; then
            echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y postgresql
            printf '%s\n' /usr/lib/postgresql/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          fi
      # free disk before and after: run 41187071384 attempt 1 crashed two gates the way a full disk does (evidence for next time)
      - name: Free disk before the gates
        run: df -h /tmp "$RUNNER_TEMP" && free -m
      - name: All blueprint gates
        run: node docs/blueprint/specs/run-all-gates.mjs
      - name: Free disk after the gates
        if: always()
        run: df -h /tmp "$RUNNER_TEMP" && free -m

  factory:
    name: factory and runner (tests and mutants)
    runs-on: ubuntu-latest
    # factory mutants about 20 min and the runner suite about 15 min on the laptop; a hosted runner is slower
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install the runner's pinned dependency (sharp), install scripts off
        run: npm ci --prefix factory/runner --ignore-scripts --no-fund
      - name: Factory tests
        run: node factory/test/run.mjs
      - name: Factory mutants
        run: node factory/test/mutate.mjs
      - name: Runner tests
        run: node factory/runner/test/run.mjs
      - name: Runner mutants
        run: node factory/runner/test/mutate.mjs

  functions:
    name: functions (Deno tests and mutants)
    runs-on: ubuntu-latest
    # stopgap 2026-11-10: work order 18 makes the functions mutants about 55 to 65 min in one job (run 42775482582 cancelled at 40m15s); sharding them is next
    timeout-minutes: 75
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.1
      - name: PostgreSQL 16 binaries on PATH (the image's own; apt install postgresql only if the image lacks them)
        run: |
          if [ -x /usr/lib/postgresql/16/bin/initdb ]; then
            echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y postgresql
            printf '%s\n' /usr/lib/postgresql/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          fi
      - name: Function tests
        run: node supabase/functions/test/run.mjs
      - name: Function mutants
        run: node supabase/functions/test/mutate.mjs

  audit:
    name: audit engine (tests and mutants)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Audit tests
        run: node tools/audit/test/run.mjs
      - name: Audit mutants
        run: node tools/audit/test/mutate.mjs

  cli:
    name: platform CLI (unit tests; full suite when the change reaches it)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: PostgreSQL 16 binaries on PATH (the image's own; apt install postgresql only if the image lacks them)
        run: |
          if [ -x /usr/lib/postgresql/16/bin/initdb ]; then
            echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y postgresql
            printf '%s\n' /usr/lib/postgresql/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          fi
      - name: CLI unit tests
        run: node tools/omnikom-cli/test/run.mjs --unit
      # the full suite (with the database part) runs only when the change can reach it (test/ci-heavy.mjs decides); the mutants run in the
      # cli-mutants-1..6 jobs below, in parallel (one job took 53 to 78 minutes, runs 42680701873, 42688877100, 42693457902)
      - name: CLI full suite (when the change reaches it)
        run: node tools/omnikom-cli/test/ci-heavy.mjs --suite

  # The CLI mutants, 6 shards in parallel (test/mutate.mjs --shard i/6: the mutant at index x of the list goes to shard (x mod 6) + 1). Written out, not a
  # matrix: omnikom ci models no strategy, and land (lib/ghrun.mjs) reads each job by its own name, so every shard is a job that must be green.
  # A change that does not reach the CLI makes each shard skip and succeed. test/mutate-run.mjs shardJobsProblems keeps the six copies identical.
  cli-mutants-1:
    name: platform CLI mutants, shard 1 of 6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: PostgreSQL 16 binaries on PATH (the image's own; apt install postgresql only if the image lacks them)
        run: |
          if [ -x /usr/lib/postgresql/16/bin/initdb ]; then
            echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y postgresql
            printf '%s\n' /usr/lib/postgresql/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          fi
      - name: CLI mutants, one shard (when the change reaches them)
        run: node tools/omnikom-cli/test/ci-heavy.mjs --shard 1/6

  cli-mutants-2:
    name: platform CLI mutants, shard 2 of 6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: PostgreSQL 16 binaries on PATH (the image's own; apt install postgresql only if the image lacks them)
        run: |
          if [ -x /usr/lib/postgresql/16/bin/initdb ]; then
            echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y postgresql
            printf '%s\n' /usr/lib/postgresql/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          fi
      - name: CLI mutants, one shard (when the change reaches them)
        run: node tools/omnikom-cli/test/ci-heavy.mjs --shard 2/6

  cli-mutants-3:
    name: platform CLI mutants, shard 3 of 6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: PostgreSQL 16 binaries on PATH (the image's own; apt install postgresql only if the image lacks them)
        run: |
          if [ -x /usr/lib/postgresql/16/bin/initdb ]; then
