          fi
      - name: CLI mutants, one shard (when the change reaches them)
        run: node tools/omnikom-cli/test/ci-heavy.mjs --shard 4/6

  cli-mutants-5:
    name: platform CLI mutants, shard 5 of 6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: PostgreSQL 16 binaries on PATH (the image's own; apt install postgresql only if the image lacks them)
        run: |
          if [ -x /usr/lib/postgresql/16/bin/initdb ]; then
            echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y postgresql
            printf '%s\n' /usr/lib/postgresql/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          fi
      - name: CLI mutants, one shard (when the change reaches them)
        run: node tools/omnikom-cli/test/ci-heavy.mjs --shard 5/6

  cli-mutants-6:
    name: platform CLI mutants, shard 6 of 6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: PostgreSQL 16 binaries on PATH (the image's own; apt install postgresql only if the image lacks them)
        run: |
          if [ -x /usr/lib/postgresql/16/bin/initdb ]; then
