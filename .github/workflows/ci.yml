          fi
      - name: CLI mutants, one shard (when the change reaches them)
        run: node tools/omnikom-cli/test/ci-heavy.mjs --shard 6/6

  dashboard:
    name: dashboard (type check, unit tests, plan gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      # DECISIONS 44: the plan gate (every element carries its plan id; no invented copy, dead control or placeholder data)
      - name: Dashboard tests
        run: node apps/dashboard/scripts/ci.mjs

  departments:
    name: departments and client files
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: One owner per path
        run: node tools/departments/check.mjs
      - name: Department tool tests
        run: node tools/departments/test/run.mjs
      # mutate.mjs first runs test/run.mjs on the unbroken copy and stops red if it fails, so this one step is both the tests and the mutants
      - name: crm-map tests and mutants
        run: node tools/crm-map/test/mutate.mjs
      - name: Client record tests
        run: node clients/test/run.mjs
      - name: ICM tests
        run: node tools/icm/test/run.mjs
      - name: ICM mutants
        run: node tools/icm/test/mutate.mjs
      - name: Lead endpoint tests
        run: node factory/worker/test/run.mjs
      - name: Lead endpoint mutants
        run: node factory/worker/test/mutate.mjs
      - name: Secret receiver tests
        run: node tools/test/test-secret-receiver.mjs
      - name: Secret receiver mutants
        run: node tools/test/mutate-secret-receiver.mjs
      - name: Site backup URL tests
        run: node tools/site-backup/test-urls.mjs
      - name: Client files
        run: node clients/check.mjs

  secrets:
    name: secret scan (gitleaks 8.30.1)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks 8.30.1 and check its sha256 (a binary, never a marketplace action)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan the history and the tree
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --redact --no-banner'
      # H2-10 (book row E17): every lockfile the platform installs from is checked for a known vulnerable or malicious package. osv-scanner
      # publishes the bare executable (tools.json says "raw"); it goes to .tools/bin, where tools/test/dep-scan.mjs looks first.
      - name: Download osv-scanner 2.7.0 and check its sha256
        run: |
          mkdir -p .tools/bin
          curl -fsSL -o .tools/bin/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  .tools/bin/osv-scanner" | sha256sum --check -
          chmod +x .tools/bin/osv-scanner
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Dependency scan tests
        run: node tools/test/test-dep-scan.mjs
      - name: Dependency scan mutants
        run: node tools/test/mutate-dep-scan.mjs
      - name: Dependency scan
        run: node tools/test/dep-scan.mjs

  workflows:
    name: workflow files (actionlint 1.7.12, shellcheck 0.11.0)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint 1.7.12 and check its sha256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
      # shellcheck is pinned too (DECISIONS 42): actionlint runs it on every run block, so the image's copy would make the check depend on the
      # runner image. The same version and sha256 are in tools/omnikom-cli/tools.json (the CLI's test fails when the two differ).
      - name: Download shellcheck 0.11.0 and check its sha256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.gz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version
      # .github/production/ holds the production repository's workflows (they never run here; linted here all the same)
      - name: Lint every workflow (with the pinned shellcheck)
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color -shellcheck "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" .github/workflows/*.yml .github/production/*.yml'
