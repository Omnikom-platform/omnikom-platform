# Hourly alert checks against the STAGING database (11-OPERATIONS section 1; the work is supabase/ops/alerts.mjs, its header lists the rules).
# Every 15 minutes would spend too many of the free Actions minutes (18-BUDGET-ARCHITECTURE); hourly is the compromise. The checks only READ
# (a read only transaction). A firing alert is printed in the log and the job summary with the name of its runbook. When the repository secrets
# ALERTS_TO, RESEND_API_KEY and LEAD_ALERT_FROM are all set, staging also mails the address in ALERTS_TO through Resend, once per alert and UTC
# day (alerts.mjs --send --to-env ALERTS_TO); a failed send turns the job red. Skipped (green, with a line saying so) while STAGING_DB_URL is absent.
# The repository variable ALERTS_RED = true makes a firing alert fail the job too; it is off by default because staging holds test data that makes
# some alerts fire. The status page's data file (omnikom-status/1) is printed into the job summary; no host for the page is chosen (supabase/ops/README.md).
# A manual run with the input test_alert = true sends exactly one marked test mail (alerts.mjs --test-alert) and nothing else: the hourly checks are left out of
# that run, so no other mail can go out with it. Never on the schedule. It needs STAGING_DB_URL set like the rest of the job (the test asks the database nothing).
name: alerts

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send exactly one marked test mail (subject TEST ALERT) to the address in ALERTS_TO, to prove the alert mail path; at most one a UTC day'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      ALERTS_RED: ${{ vars.ALERTS_RED }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LEAD_ALERT_FROM: ${{ secrets.LEAD_ALERT_FROM }}
      ALERTS_TO: ${{ secrets.ALERTS_TO }}
    steps:
      - name: Is the secret there
        id: gate
        run: |
          if [ -z "$STAGING_DB_URL" ]; then
            echo "STAGING_DB_URL is not set in this repository: the alert checks are skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Run the alert checks (read only)
        if: steps.gate.outputs.run == 'true' && !inputs.test_alert
        run: |
          flags=()
          if [ "$ALERTS_RED" = "true" ]; then flags+=(--fail-on-alert); fi
          if [ -n "$ALERTS_TO" ] && [ -n "$RESEND_API_KEY" ] && [ -n "$LEAD_ALERT_FROM" ]; then flags+=(--send --to-env ALERTS_TO); fi
          set +e
          node supabase/ops/alerts.mjs --db STAGING_DB_URL --json "$RUNNER_TEMP/status.json" "${flags[@]}" | tee "$RUNNER_TEMP/alerts.txt"
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### Alert checks (staging)"
            echo '```'
            cat "$RUNNER_TEMP/alerts.txt"
            echo '```'
            echo "### Status data (omnikom-status/1)"
            echo '```json'
            cat "$RUNNER_TEMP/status.json" 2> /dev/null || echo "(no status file: the checks did not finish)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Send the one test alert (only when asked by hand)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && inputs.test_alert
        run: |
          missing=()
          for n in RESEND_API_KEY LEAD_ALERT_FROM ALERTS_TO; do if [ -z "${!n}" ]; then missing+=("$n"); fi; done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "test alert NOT sent: these repository secrets are not set: ${missing[*]}"
            echo "test alert NOT sent: these repository secrets are not set: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          set +e
          node supabase/ops/alerts.mjs --db STAGING_DB_URL --test-alert --send --to-env ALERTS_TO 2>&1 | tee "$RUNNER_TEMP/test-alert.txt"
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### Test alert (staging)"
            echo '```'
            tail -n 1 "$RUNNER_TEMP/test-alert.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
