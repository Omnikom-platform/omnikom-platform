# THIS FILE DOES NOT RUN IN THE PLATFORM REPOSITORY. It is the production repository's alerts workflow: copy it to
# .github/workflows/alerts.yml of the PRODUCTION repository (DECISIONS 29 D21: the working repository never holds a production key).
# This file holds no secret value, only the NAMES of the secrets the production repository must hold.
# Hourly alert checks against the PRODUCTION database (11-OPERATIONS section 1; the work is supabase/ops/alerts.mjs, its header lists the rules).
# Every 15 minutes would spend too many of the free Actions minutes (18-BUDGET-ARCHITECTURE); hourly is the compromise. The checks only READ
# (a read only transaction). A firing alert is printed in the log and the job summary with the name of its runbook. When the repository secrets
# ALERTS_TO, RESEND_API_KEY and LEAD_ALERT_FROM are all set, production also mails the address in ALERTS_TO through Resend, once per alert and
# UTC day (alerts.mjs --send --to-env ALERTS_TO); a failed send turns the job red. Skipped (green, with a line saying so) while PROD_DB_URL is absent.
# The repository variable ALERTS_RED = true makes a firing alert fail the job too. The status page's data file (omnikom-status/1) is printed
# into the job summary; no host for the page is chosen (supabase/ops/README.md).
name: alerts

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      ALERTS_RED: ${{ vars.ALERTS_RED }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LEAD_ALERT_FROM: ${{ secrets.LEAD_ALERT_FROM }}
      ALERTS_TO: ${{ secrets.ALERTS_TO }}
    steps:
      - name: Is the secret there
        id: gate
        run: |
          if [ -z "$PROD_DB_URL" ]; then
            echo "PROD_DB_URL is not set in this repository: the alert checks are skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Run the alert checks (read only)
        if: steps.gate.outputs.run == 'true'
        run: |
          flags=()
          if [ "$ALERTS_RED" = "true" ]; then flags+=(--fail-on-alert); fi
          if [ -n "$ALERTS_TO" ] && [ -n "$RESEND_API_KEY" ] && [ -n "$LEAD_ALERT_FROM" ]; then flags+=(--send --to-env ALERTS_TO); fi
          set +e
          node supabase/ops/alerts.mjs --db PROD_DB_URL --json "$RUNNER_TEMP/status.json" "${flags[@]}" | tee "$RUNNER_TEMP/alerts.txt"
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### Alert checks (production)"
            echo '```'
            cat "$RUNNER_TEMP/alerts.txt"
            echo '```'
            echo "### Status data (omnikom-status/1)"
            echo '```json'
            cat "$RUNNER_TEMP/status.json" 2> /dev/null || echo "(no status file: the checks did not finish)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
