<!doctype html>
<!-- design-engine template: style a real basemap (basemap.mjs output) and draw the client's overlay on top, then render it with
     render-asset.mjs. Query string: ?map=<path to basemap.json>&cfg=<path to overlay.json>&bare=1 (base only).
     overlay.json: { "duotone": {"dark":"#6b8597","light":"#f6f1e7"}, "accent":"#a96d14", "font":"Instrument Sans",
       "routes": [ {"points": [[lat,lon] | "slug", ...], "style": "main"|"branch"} ],
       "labels": { "<slug>": "l"|"r"|"b"|"ru"|"rd" }, "hub": "<slug>", "regions": [ ["Name", lat, lon] ], "fontCss": "<path to fonts.css>" }
     First used for ELEV8 (2026-10-27): duotone cream / bay blue, route along I-680 / I-80 / CA-29. -->
<html><head><meta charset="utf-8"><link id="fonts" rel="stylesheet" href="">
<style>
html,body{margin:0;background:#111}
#art{position:relative;overflow:hidden}
.tiles{position:absolute;inset:0;filter:url(#duo)}
.tiles img{position:absolute;width:256px;height:256px;display:block}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 58%,rgba(40,28,14,.2) 100%)}
svg.ov{position:absolute;inset:0;width:100%;height:100%}
.route{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-weight:700;paint-order:stroke;stroke-linejoin:round}
.region{font-weight:600;font-style:italic;letter-spacing:.06em;text-transform:uppercase}
.attr{position:absolute;right:12px;bottom:10px;font:500 13px/1 system-ui,sans-serif;color:#5c5246;background:rgba(255,255,255,.8);padding:5px 8px;border-radius:6px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="duo" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".33 .33 .33 0 0  .33 .33 .33 0 0  .33 .33 .33 0 0  0 0 0 1 0"/>
<feComponentTransfer><feFuncR id="fr" type="table"/><feFuncG id="fg" type="table"/><feFuncB id="fb" type="table"/></feComponentTransfer></filter></svg>
<div id="art"><div class="tiles" id="tiles"></div><div class="vig"></div><svg class="ov" id="ov" aria-hidden="true"><defs><filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="gb"/></filter></defs></svg><div class="attr" id="attr"></div></div>
<script>
window.__ready = (async () => {
  const q = new URLSearchParams(location.search), mapUrl = q.get('map'), base = mapUrl.replace(/[^/]*$/, '');
  const m = await fetch(mapUrl).then(r => r.json()), cfg = q.get('cfg') ? await fetch(q.get('cfg')).then(r => r.json()) : {};
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255), d = hex(cfg.duotone?.dark || '#6b8597'), l = hex(cfg.duotone?.light || '#f6f1e7');
  // four-step ramp: darkest -> dark, two mids, lightest -> light (water and roads take the dark end, land the light end)
  const ramp = i => [0, .45, .78, 1].map(t => (d[i] + (l[i] - d[i]) * t).toFixed(3)).join(' ');
  document.getElementById('fr').setAttribute('tableValues', ramp(0)); document.getElementById('fg').setAttribute('tableValues', ramp(1)); document.getElementById('fb').setAttribute('tableValues', ramp(2));
  if (cfg.fontCss) document.getElementById('fonts').href = cfg.fontCss;
  const art = document.getElementById('art'); art.style.width = m.width + 'px'; art.style.height = m.height + 'px'; art.style.background = cfg.duotone?.light || '#f6f1e7';
  document.getElementById('attr').textContent = m.attribution;
  const T = document.getElementById('tiles');
  await Promise.all(m.tiles.map(t => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = base + t.src; i.style.left = t.x + 'px'; i.style.top = t.y + 'px'; T.appendChild(i); })));
  if (q.get('bare')) return;
  const k = m.width / 1024, acc = cfg.accent || '#a96d14', font = `"${cfg.font || 'system-ui'}",system-ui,sans-serif`;
  const ov = document.getElementById('ov'); ov.setAttribute('viewBox', `0 0 ${m.width} ${m.height}`); document.getElementById('gb').setAttribute('stdDeviation', 7 * k);
  const N = 2 ** m.zoom, wx = lon => (lon + 180) / 360 * N * 256, wy = lat => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * N * 256; };
  const P = (lat, lon) => [wx(lon) - m.origin[0], wy(lat) - m.origin[1]], S = Object.fromEntries(m.places.map(p => [p.slug, [p.x, p.y]]));
  const pt = v => typeof v === 'string' ? S[v] : P(v[0], v[1]);
  const smooth = ps => { let s = `M${ps[0]}`; for (let i = 0; i < ps.length - 1; i++) { const p0 = ps[i - 1] || ps[i], p1 = ps[i], p2 = ps[i + 1], p3 = ps[i + 2] || p2; s += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2}`; } return s; };
  const NS = 'http://www.w3.org/2000/svg', add = (tag, at, p = ov) => { const e = document.createElementNS(NS, tag); for (const x in at) e.setAttribute(x, at[x]); p.appendChild(e); return e; };
  const routes = cfg.routes || [];
  for (const r of routes.filter(r => r.style === 'main')) add('path', { class: 'route', d: smooth(r.points.map(pt)), stroke: '#f2c47a', 'stroke-width': 18 * k, opacity: .45, filter: 'url(#blur)' });
  for (const r of [...routes].sort((a, b) => (a.style === 'main') - (b.style === 'main'))) { const dd = smooth(r.points.map(pt)), main = r.style === 'main';
    add('path', { class: 'route', d: dd, stroke: '#fffdf8', 'stroke-width': (main ? 9 : 7) * k }); add('path', { class: 'route', d: dd, stroke: acc, 'stroke-width': (main ? 5 : 4) * k, ...(main ? {} : { 'stroke-dasharray': `${2 * k} ${9 * k}` }) }); }
  for (const [t, lat, lon] of cfg.regions || []) { const [x, y] = P(lat, lon); const e = add('text', { class: 'region', x, y, 'text-anchor': 'middle', 'font-size': 13 * k, fill: '#7d7466', 'font-family': font }); e.textContent = t; }
  for (const p of m.places) { const hub = p.slug === cfg.hub, g = add('g', {});
    add('circle', { cx: p.x, cy: p.y, r: (hub ? 10 : 8) * k, fill: '#fffdf8', stroke: hub ? acc : '#141414', 'stroke-width': (hub ? 4 : 3) * k }, g); add('circle', { cx: p.x, cy: p.y, r: 3.2 * k, fill: '#141414' }, g);
    const s = (cfg.labels || {})[p.slug] || 'r', [dx, dy, an] = s === 'l' ? [-15, 6, 'end'] : s === 'b' ? [0, 32, 'middle'] : s === 'ru' ? [15, -8, 'start'] : s === 'rd' ? [15, 22, 'start'] : [15, 6, 'start'];
    const t = add('text', { class: 'lbl', x: p.x + dx * k, y: p.y + dy * k, 'text-anchor': an, 'font-size': 18 * k, 'stroke-width': 6 * k, fill: '#141414', stroke: 'rgba(255,253,248,.95)', 'font-family': font }, g); t.textContent = p.name; }
})();
</script>
</body></html>
