# Supabase project config (functions part). Source: https://supabase.com/docs/guides/functions/auth (checked 2026-10-28):
# the platform validates a user JWT before the handler runs unless verify_jwt = false. Functions called by machines
# (build runner, site Workers, pg_cron) have no user JWT, so the gateway check is off and EACH ONE verifies its own
# credential in code before doing anything (02-BACKEND.md section 6; tests in W1.3 / W2.4: forged or missing -> 401).

[functions.save]
verify_jwt = true            # dashboard user

[functions.publish]
verify_jwt = true            # dashboard user

[functions.upload-start]
verify_jwt = true            # dashboard user

[functions.upload-finish]
verify_jwt = true            # dashboard user

[functions.export-published]
verify_jwt = false           # build runner: verifies X-Runner-Signature in code (supabase/functions/_shared/signature.ts)

[functions.job-callback]
verify_jwt = false           # build runner: verifies X-Runner-Signature (HMAC of the body) in code

[functions.capture-lead]
verify_jwt = false           # site Worker: verifies X-Site-Signature (HMAC with that site's signing key) in code

# planned: W6.3 (05-BUILD-PLAN.md; no folder under supabase/functions yet)
[functions.push-lead]
verify_jwt = false           # pg_cron / queue: verifies the internal cron secret header in code

# Work order 44 (2026-11-11): the daily metrics pull and the sitemap submit. Machine calls: each verifies X-Cron-Signature (HMAC with CRON_KEY) in code.
[functions.metrics-pull]
verify_jwt = false           # pg_cron through pg_net (service.metrics_pull_all): verifies X-Cron-Signature in code; one workspace per call

[functions.sitemap-submit]
verify_jwt = false           # head or cron: verifies X-Cron-Signature in code (job-callback runs the same code itself on done of a production job)

[functions.media-process-callback]
verify_jwt = false           # media processor (runner): verifies X-Runner-Signature in code

# Slice 4.2 (2026-10-31): the two dashboard functions that had no entry. Both take the user's JWT (verify_jwt = true) and check it again
# in code (supabase/functions/_shared/auth.ts, the second wall).
[functions.lead-update]
verify_jwt = true            # dashboard user

[functions.add-lead]
verify_jwt = true            # dashboard user

# Slice 4.3 (2026-10-31): the media job's first call. The runner signs it (X-Runner-Signature) and the function verifies it in code, like export-published.
[functions.media-export]
verify_jwt = false           # build runner (media job): verifies X-Runner-Signature in code (supabase/functions/_shared/runner.ts)

# Slice 5.2 (2026-10-31): the functions of the four screens. All take the user's JWT (verify_jwt = true) and check it again in code (_shared/auth.ts, the second
# wall); all run in the dashboard frame (_shared/dashboard.ts), which also answers the browser's CORS preflight (OPTIONS) before any token is looked at. The
# gateway lets a preflight through unauthenticated; that is UNPROVEN on staging until e2e-screens.mjs has run it.
[functions.drafts]
verify_jwt = true            # dashboard user

[functions.settings-save]
verify_jwt = true            # dashboard user

[functions.lead-export]
verify_jwt = true            # dashboard user

[functions.lead-list]
verify_jwt = true            # dashboard user

[functions.leads-bulk]
verify_jwt = true            # dashboard user

# Work order 18 (2026-11-09): saved views, follow-up and tasks of the CRM. Dashboard functions (the walls are in the database).
[functions.view-save]
verify_jwt = true            # dashboard user

[functions.view-delete]
verify_jwt = true            # dashboard user

[functions.lead-task]
verify_jwt = true            # dashboard user

[functions.invite-member]
verify_jwt = true            # dashboard user

# Work order 08 (2026-11-05): the Team card of Settings. Owner only (checked in the database).
[functions.team-list]
verify_jwt = true            # dashboard user

[functions.member-remove]
verify_jwt = true            # dashboard user

# Work order 02 (2026-11-04): the CRM export and import in the client's own layout. Dashboard functions, owner only (checked in the database).
[functions.crm-map-propose]
verify_jwt = true            # dashboard user

[functions.crm-template-save]
verify_jwt = true            # dashboard user

[functions.lead-import]
verify_jwt = true            # dashboard user

# Work order 10 (2026-11-04): a site's stored audit summaries. Dashboard function, owner (or staff with MFA) of the site's workspace only (checked in the database).
[functions.site-audit]
verify_jwt = true            # dashboard user

# supabase/functions/test holds the Deno tests, not a function. A bare `supabase functions deploy` deploys every folder of supabase/functions
# unless it is disabled here, so the test folder is switched off (deploys are by name through tools/deploy-functions.mjs anyway).
[functions.test]
enabled = false
